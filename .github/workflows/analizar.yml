name: Analizar mercado

on:
  schedule:
    # Cada 30 min, lunes a viernes, durante el horario de la bolsa de Nueva York
    # (8:00 a.m. - 4:00 p.m. hora Colombia). GitHub usa hora UTC.
    - cron: "5,35 13-21 * * 1-5"
  workflow_dispatch: {}   # botón "Run workflow" para ejecutarlo a mano

permissions:
  contents: write

concurrency:
  group: analizar
  cancel-in-progress: false

jobs:
  analizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Ejecutar análisis
        env:
          FINNHUB_KEY: ${{ secrets.FINNHUB_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          if [ -z "$FINNHUB_KEY" ] || [ -z "$GEMINI_API_KEY" ]; then
            echo "::warning::Faltan las claves FINNHUB_KEY / GEMINI_API_KEY. Se generan datos DEMO."
            python backend/analizar.py --demo
          else
            python backend/analizar.py
          fi

      - name: Guardar resultados
        run: |
          git config user.name "money-ia-bot"
          git config user.email "money-ia-bot@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Señales $(date -u +'%Y-%m-%d %H:%M') UTC"
            git pull --rebase
            git push
          fi
