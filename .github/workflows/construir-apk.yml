name: Construir APK

on:
  workflow_dispatch: {}   # botón "Run workflow"
  push:
    paths:
      - "app/**"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Preparar proyecto Android
        working-directory: app
        run: |
          flutter create --platforms=android --org co.criga --project-name money_app .
          M=android/app/src/main/AndroidManifest.xml
          grep -q 'android.permission.INTERNET' "$M" || \
            sed -i 's|<application|<uses-permission android:name="android.permission.INTERNET"/>\n    <application|' "$M"
          sed -i 's|android:label="money_app"|android:label="Money IA"|' "$M"
          rm -rf test

      - name: Compilar APK
        working-directory: app
        run: |
          flutter pub get
          flutter build apk --release
          cp build/app/outputs/flutter-apk/app-release.apk ../MoneyIA.apk

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: apk-${{ github.run_number }}
          name: Money IA v${{ github.run_number }}
          body: Descarga MoneyIA.apk desde el celular e instálala.
          files: MoneyIA.apk
